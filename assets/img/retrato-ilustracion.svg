    <path d="M220 331L-380 540M220 331L-180 540M220 331L20 540M220 331V540M220 331L420 540M220 331L620 540M220 331L820 540"/>
    <path d="M0 338H440M0 350H440M0 368H440M0 393H440M0 425H440M0 466H440M0 516H440"/>
