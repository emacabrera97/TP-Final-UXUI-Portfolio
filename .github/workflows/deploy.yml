# Deploy automático a GitHub Pages en cada push a main (CI/CD).
# Requisito único en GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Sitio estático: se publica tal cual, sin paso de build.
      # Solo se copian los archivos del sitio (no el PDF de la consigna ni docs/).
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html caso-estudio.html 404.html favicon.svg css js assets _site/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
